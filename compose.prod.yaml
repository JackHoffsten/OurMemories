name: ourmemories-prod

x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }

services:
  gateway:
    image: ourmemories-gateway:${RELEASE_SHA:?Set the full release SHA}
    ports: ['127.0.0.1:18081:80']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [app]
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

  backend:
    image: ourmemories-backend:${RELEASE_SHA:?Set the full release SHA}
    environment:
      SPRING_PROFILES_ACTIVE: prod
    secrets: [app_password, migration_password]
    networks: [app, database]
    read_only: true
    tmpfs: ['/tmp:size=256m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 1200m
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://localhost:9090/actuator/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *logging

  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: our_memories
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [admin_password, app_password, migration_password]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks: [database]
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d our_memories']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

networks:
  app: {}
  database: { internal: true }

volumes:
  postgres_data: {}

secrets:
  admin_password: { file: /etc/ourmemories/secrets/admin_password }
  app_password: { file: /etc/ourmemories/secrets/app_password }
  migration_password: { file: /etc/ourmemories/secrets/migration_password }
