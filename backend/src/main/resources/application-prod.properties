spring.config.import=configtree:/run/secrets/
spring.datasource.url=jdbc:postgresql://postgres:5432/our_memories
spring.datasource.username=ourmemories_app
spring.datasource.password=${app_password}
spring.flyway.url=jdbc:postgresql://postgres:5432/our_memories
spring.flyway.user=ourmemories_migrator
spring.flyway.password=${migration_password}
server.forward-headers-strategy=framework
management.server.port=9090
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
server.tomcat.max-http-form-post-size=16KB
server.tomcat.max-swallow-size=12MB
